name: ${COMPOSE_PROJECT_NAME:-cloudreport}

services:
  cloudreport:
    image: ${CLOUDREPORT_IMAGE:-docker.io/rovann/cloudreport:latest}
    hostname: cloudreport
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__CloudReport: "${CLOUDREPORT_CONNECTION_STRING:?CLOUDREPORT_CONNECTION_STRING nao definida}"
      Jwt__Key: "${JWT_KEY:?JWT_KEY nao definida}"
      Database__ApplyMigrationsOnStartup: "true"
      DataProtection__KeysPath: /data/keys
      BlobStorage__Provider: "${BLOB_PROVIDER:-Local}"
      BlobStorage__LocalPath: /data/storage
      BlobStorage__PublicBaseUrl: "${PUBLIC_URL:?PUBLIC_URL nao definida}/api"
      BlobStorage__Endpoint: "${MINIO_ENDPOINT:-}"
      BlobStorage__AccessKey: "${MINIO_ACCESS_KEY:-}"
      BlobStorage__SecretKey: "${MINIO_SECRET_KEY:-}"
      BlobStorage__Bucket: "${MINIO_BUCKET:-cloudreport}"
      BlobStorage__UseSsl: "${MINIO_USE_SSL:-true}"
      Cors__AllowedOrigins__0: "${PUBLIC_URL}"
      License__Provider: Linhalis
      License__ApplicationKey: cloud-report
      License__InstanceIdentityPath: /data/instance/identity.key
      License__LicenseWebhookUrl: "${LICENSE_WEBHOOK_URL:-https://n8n.linhalis.com/webhook/54791385-36ab-4ecf-80ef-1ec62c29f91f}"
      License__RegistrationSiteUrl: https://linhalis.com/
      License__RegistrationWhatsAppUrl: https://wa.me/5527995790376
    volumes:
      - cloudreport-data:/data
      - ${INSTANCE_IDENTITY_DIR:-./state/instance}:/data/instance
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - cloudreport

  postgres:
    image: postgres:17-alpine
    profiles: ["database"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudreport}
      POSTGRES_USER: ${POSTGRES_USER:-cloudreport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD nao definida}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
    security_opt:
      - no-new-privileges:true
    networks:
      - cloudreport

volumes:
  cloudreport-data:
  postgres-data:

networks:
  cloudreport:
    driver: bridge
