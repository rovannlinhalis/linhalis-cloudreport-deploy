name: Sync published CloudReport version

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-published-cloudreport-version
  cancel-in-progress: true

jobs:
  sync-version:
    name: Update version.json from Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v4

      - name: Read latest published image
        run: node scripts/sync-version.mjs

      - name: Publish manifest change
        shell: bash
        run: |
          if git diff --quiet -- version.json; then
            echo 'version.json is already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m 'chore: sync published CloudReport version'
          git push
